name: Terraform Validate

on:
  push:
    branches: ["main", "feature/**"]
    paths:    ["terraform/**"]
  pull_request:
    branches: ["main"]
    paths:    ["terraform/**"]

jobs:
  validate:
    name: fmt + validate + plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.7"

      # Fail fast if any file is not formatted
      - name: terraform fmt
        run: terraform fmt -check -recursive

      # Init with a local backend override so no real AWS state bucket is needed in CI
      - name: terraform init (local backend)
        run: |
          terraform init \
            -backend=false \
            -input=false

      - name: terraform validate
        run: terraform validate

      # plan requires a real AWS backend - omitted in CI (no credentials available).
      # fmt + init + validate is sufficient to catch config and syntax errors.
